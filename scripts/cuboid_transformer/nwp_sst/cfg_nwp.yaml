# Earthformer NW Pacific SSTA Prediction Config
# Input:  (14, 161, 241, 3) = 14 days × 3 channels (ssta, u10, v10)
# Output: (3, 161, 241, 1)  =  3 days × 1 channel  (ssta)

dataset:
  data_dir: "datasets/SST-PREDICT/"
  in_len: 14
  out_len: 3
  var_names: ["ssta", "u10", "v10"]

layout:
  in_len: 14
  out_len: 3
  layout: "NTHWC"

optim:
  total_batch_size: 16
  micro_batch_size: 2
  seed: 0
  method: "adamw"
  lr: 0.0001
  wd: 1.0e-05
  gradient_clip_val: 1.0
  max_epochs: 50
  lr_scheduler_mode: "cosine"
  min_lr_ratio: 1.0e-3
  warmup_min_lr_ratio: 0.0
  warmup_percentage: 0.1
  early_stop: true
  early_stop_mode: "min"
  early_stop_patience: 10
  save_top_k: 3

logging:
  logging_prefix: "NWP_SST"
  monitor_lr: true
  monitor_device: false
  track_grad_norm: -1
  use_wandb: false

trainer:
  check_val_every_n_epoch: 1
  log_step_ratio: 0.001
  precision: 32

vis:
  eval_example_only: false

model:
  base_units: 64
  scale_alpha: 1.0
  enc_depth: [2, 2, 2]
  dec_depth: [2, 2, 2]
  enc_use_inter_ffn: true
  dec_use_inter_ffn: true
  dec_hierarchical_pos_embed: true
  downsample: 2
  downsample_type: "patch_merge"
  upsample_type: "upsample"

  num_global_vectors: 8
  use_dec_self_global: true
  dec_self_update_global: true
  use_dec_cross_global: true
  use_global_vector_ffn: true
  use_global_self_attn: false
  separate_global_qkv: false
  global_dim_ratio: 1

  self_pattern: ["axial", "spatial_lg_8", "divided_st"]
  cross_self_pattern: ["axial", "spatial_lg_8", "divided_st"]
  cross_pattern: ["cross_1x1", "cross_1x1", "cross_1x1"]
  dec_cross_last_n_frames: null

  attn_drop: 0.1
  proj_drop: 0.1
  ffn_drop: 0.1
  num_heads: 4
  ffn_activation: "gelu"
  gated_ffn: false
  norm_layer: "layer_norm"
  padding_type: "zeros"
  pos_embed_type: "t+h+w"
  use_relative_pos: true
  self_attn_use_final_proj: true
  dec_use_first_self_attn: false
  z_init_method: "zeros"

  initial_downsample_type: "conv"
  initial_downsample_activation: "leaky"
  initial_downsample_scale: [1, 4, 4]
  initial_downsample_conv_layers: 3
  final_upsample_conv_layers: 2
  checkpoint_level: 0

  attn_linear_init_mode: "0"
  ffn_linear_init_mode: "0"
  conv_init_mode: "0"
  down_up_linear_init_mode: "0"
  norm_init_mode: "0"
